name: County pilot checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: county-pilot-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements-county.txt
      - name: Offline county collector, transaction and publishing tests
        run: |
          python -m pytest tests/test_county_reacquisition.py tests/test_county_scheduled_run.py tests/test_publish_county_update.py tests/test_coverage_dashboard.py -q --cov=geode.pipeline.county_reacquisition --cov=geode.pipeline.county_scheduled_run --cov=geode.pipeline.coverage_dashboard --cov=scripts.publish_county_update --cov-branch --cov-report=term-missing --cov-report=xml:county-pilot.xml --junitxml=county-pilot-tests.xml
          python -m coverage report --fail-under=90 --include=geode/pipeline/county_reacquisition.py
          python -m coverage report --fail-under=90 --include=geode/pipeline/county_scheduled_run.py
          python -m coverage report --fail-under=90 --include=geode/pipeline/coverage_dashboard.py
          python -m coverage report --fail-under=90 --include=scripts/publish_county_update.py
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: county-pilot-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            county-pilot-tests.xml
            county-pilot.xml
          retention-days: 30
          if-no-files-found: warn
