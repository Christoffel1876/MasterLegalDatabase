name: Coverage and CCR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-ccr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Offline CCR parser, transaction and publishing tests
        run: |
          python -m pytest tests/test_ccr_current.py tests/test_publish_ccr_current.py tests/test_coverage_dashboard.py -q --cov=geode.pipeline.ccr_current --cov=geode.pipeline.coverage_dashboard --cov=scripts.publish_ccr_current --cov-branch --cov-report=term-missing --cov-report=xml:coverage-ccr.xml --junitxml=coverage-ccr-tests.xml
          python -m coverage report --fail-under=90 --include=geode/pipeline/ccr_current.py
          python -m coverage report --fail-under=90 --include=geode/pipeline/coverage_dashboard.py
          python -m coverage report --fail-under=90 --include=scripts/publish_ccr_current.py
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ccr-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-ccr-tests.xml
            coverage-ccr.xml
          retention-days: 30
          if-no-files-found: warn
