  <script>
    (() => {
      const root = document.getElementById('geode-review-inventory');
      const rows = JSON.parse(root.querySelector('#inv-source-data').textContent);
      const groups = [
        ['CO-COUNTY-ARAPAHOE', 'Arapahoe County'],
        ['CO-COUNTY-LARIMER', 'Larimer County'],
        ['CO-MUNICIPAL-FORT_COLLINS', 'Fort Collins'],
        ['CO-COUNTY-WELD', 'Weld County'],
        ['CO-MUNICIPAL-GREELEY', 'Greeley'],
        ['CO-COUNTY-MESA', 'Mesa County'],
        ['CO-MUNICIPAL-GRAND_JUNCTION', 'Grand Junction'],
        ['CO-COUNTY-EL_PASO', 'El Paso County'],
        ['CO-MUNICIPAL-COLORADO_SPRINGS', 'Colorado Springs'],
        ['CO-COUNTY-DOUGLAS', 'Douglas County'],
        ['CO-MUNICIPAL-PUEBLO', 'City of Pueblo']
      ];
      const kinds = {checked_tables: 'Checked tables', checked_passages: 'Checked passages', source_structure: 'Source structure reviewed'};
      const targets = new Map();
      const container = root.querySelector('#inv-authorities');
      function select(row) {
        for (const [id, button] of targets) button.setAttribute('aria-pressed', String(id === row.id));
        root.dataset.selectedSource = row.id;
        root.querySelector('#inv-selected-name').textContent = groups.find(group => group[0] === row.a)[1] + ' · ' + row.label;
        root.querySelector('#inv-selected-status').textContent = 'PDF preserved · ' + (row.kind ? kinds[row.kind] : 'No mapped review');
        root.querySelector('#inv-selected-scope').textContent = row.scope || 'No review artifact is mapped in this inventory; prior inspection may still exist.';
        root.querySelector('#inv-selected-limit').textContent = row.limit || 'Current legal effect, completeness and applicability remain unverified.';
      }
      for (const [authority, name] of groups) {
        const members = rows.filter(row => row.a === authority);
        const section = document.createElement('div');
        section.className = 'inv-group';
        const label = document.createElement('div');
        label.className = 'inv-authority text-small';
        label.textContent = name + ' · ' + members.length;
        const cells = document.createElement('div');
        cells.className = 'inv-cells';
        cells.setAttribute('role', 'group');
        cells.setAttribute('aria-label', name);
        for (const row of members) {
          const cell = document.createElement('div');
          cell.className = 'inv-cell';
          cell.dataset.mapped = String(row.kind !== null);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn viz-tile';
          button.textContent = row.label;
          button.dataset.sourceId = row.id;
          button.setAttribute('aria-pressed', 'false');
          button.setAttribute('aria-label', name + ', ' + row.id + ', PDF preserved, ' + (row.kind ? kinds[row.kind] : 'no mapped review') + ', current law unknown');
          button.addEventListener('click', () => select(row));
          targets.set(row.id, button);
          cell.append(button);
          cells.append(cell);
        }
        section.append(label, cells);
        container.append(section);
      }
      root.querySelector('#inv-total-count').textContent = rows.length;
      root.querySelector('#inv-reviewed-count').textContent = rows.filter(row => row.kind !== null).length;
      root.querySelector('#inv-unmapped-count').textContent = rows.filter(row => row.kind === null).length;
      select(rows.find(row => row.id === 'douglas-ehs-fees-atlas-directed'));
    })();
  </script>
